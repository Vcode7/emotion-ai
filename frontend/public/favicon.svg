<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Antenna -->
  <line x1="32" y1="8" x2="32" y2="16" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="6" r="3" fill="#3b82f6" opacity="0.9"/>
  <circle cx="32" cy="6" r="5" fill="#3b82f6" opacity="0.2"/>
  <!-- Head -->
  <rect x="12" y="16" width="40" height="32" rx="8" ry="8" fill="url(#headGrad)" stroke="#334155" stroke-width="1.5"/>
  <!-- Left eye glow -->
  <circle cx="22" cy="30" r="8" fill="url(#eyeGlow)" opacity="0.3"/>
  <!-- Right eye glow -->
  <circle cx="42" cy="30" r="8" fill="url(#eyeGlow)" opacity="0.3"/>
  <!-- Left eye -->
  <circle cx="22" cy="30" r="4.5" fill="#06b6d4"/>
  <circle cx="23" cy="29" r="1.5" fill="#fff" opacity="0.7"/>
  <!-- Right eye -->
  <circle cx="42" cy="30" r="4.5" fill="#06b6d4"/>
  <circle cx="43" cy="29" r="1.5" fill="#fff" opacity="0.7"/>
  <!-- Mouth -->
  <path d="M24 40 Q32 44 40 40" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
  <!-- Ears -->
  <rect x="6" y="24" width="6" height="12" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="52" y="24" width="6" height="12" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <!-- Body hint -->
  <rect x="22" y="48" width="20" height="10" rx="4" fill="url(#headGrad)" stroke="#334155" stroke-width="1"/>
  <circle cx="28" cy="53" r="1.5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="36" cy="53" r="1.5" fill="#8b5cf6" opacity="0.6"/>
</svg>
